<!doctype html>
<html lang="en" data-theme="auto" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Switchboard · stop coding agents from colliding</title>
    <meta name="description" content="A FalkorDB graph that checks every agent edit against the code's real dependencies." />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0d" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable app: Chrome/Edge read the manifest (no service worker needed); Safari "Add to Dock" reads it plus the apple-* tags. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Switchboard" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!--
      Share cards. SITE_URL = https://switchboard-agents.xyz
      Crawlers need absolute URLs, so og:url, og:image and twitter:image spell it out.
      To change the domain, replace that one string in this file.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Switchboard" />
    <meta property="og:title" content="Switchboard: coding agents can't see each other. Switchboard can." />
    <meta property="og:description" content="One FalkorDB graph checks every agent edit against your code's real import paths and stops two agents before they collide." />
    <meta property="og:url" content="https://switchboard-agents.xyz/" />
    <meta property="og:image" content="https://switchboard-agents.xyz/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Agent B's edit refused: LoginForm.tsx reaches session.ts, which agent A is editing, in 2 imports." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Switchboard: coding agents can't see each other. Switchboard can." />
    <meta name="twitter:description" content="One FalkorDB graph checks every agent edit against your code's real import paths and stops two agents before they collide." />
    <meta name="twitter:image" content="https://switchboard-agents.xyz/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
